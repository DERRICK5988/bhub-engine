services:
  bhub-engine:
    build: .
    container_name: bhub-engine
    restart: unless-stopped
    # No published ports — internal only.
    # n8n reaches it on the shared network at:  http://bhub-engine:8000

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Kuala_Lumpur
      - TZ=Asia/Kuala_Lumpur
      # plain-http phase only; we switch this back on once HTTPS is in (C5)
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
